<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6fb">
  <title>Simple Calculator</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f4f6fb;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 12% 15%, #e7edff 0, transparent 34%),
        radial-gradient(ellipse at 90% 85%, #e9f4ff 0, transparent 32%),
        #f4f6fb;
    }

    .calculator {
      width: min(100%, 360px);
      padding: 26px;
      border: 1px solid #e8ebf3;
      border-radius: 28px;
      background: #fff;
      box-shadow: 0 24px 70px #26385d1c, 0 3px 10px #26385d0a;
    }

    .heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h1 { margin: 0; font-size: 17px; letter-spacing: -.3px; }

    .badge {
      padding: 6px 9px;
      border-radius: 99px;
      background: #eff2ff;
      color: #5368d9;
      font-size: 11px;
      font-weight: 700;
    }

    .display {
      min-height: 118px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      gap: 8px;
      overflow: hidden;
      padding: 18px 16px;
      margin-bottom: 18px;
      border-radius: 18px;
      background: #f7f8fc;
    }

    #expression {
      min-height: 18px;
      max-width: 100%;
      overflow: hidden;
      color: #8b93a5;
      font-size: 13px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #result {
      max-width: 100%;
      overflow: hidden;
      font-size: clamp(32px, 10vw, 42px);
      font-weight: 650;
      letter-spacing: -1.5px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      min-height: 58px;
      border: 0;
      border-radius: 16px;
      background: #f4f5f9;
      color: #25304a;
      font: inherit;
      font-size: 19px;
      font-weight: 550;
      cursor: pointer;
      transition: transform 120ms ease, background 120ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover { background: #e9ecf4; }
    button:active { transform: scale(.96); }
    button:focus-visible { outline: 3px solid #aeb9ff; outline-offset: 2px; }
    button.utility { color: #65708a; font-size: 15px; }
    button.operator { background: #eef0ff; color: #5667d8; font-size: 22px; }
    button.operator:hover { background: #e1e5ff; }
    button.selected { background: #dfe4ff; }
    button.equals { background: #596be0; color: #fff; font-size: 23px; }
    button.equals:hover { background: #485bd1; }
    button.zero { grid-column: span 2; }

    .hint {
      min-height: 16px;
      margin: 14px 0 0;
      color: #8a92a4;
      font-size: 11px;
      text-align: center;
    }

    .hint.error { color: #c34252; }

    @media (max-width: 380px) {
      .calculator { padding: 20px; }
      .keys { gap: 8px; }
      button { min-height: 54px; }
    }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <div class="heading">
      <h1>Calculator</h1>
      <span class="badge">PYTHON POWERED</span>
    </div>
    <section class="display" aria-live="polite" aria-atomic="true">
      <div id="expression"></div>
      <div id="result">0</div>
    </section>
    <div class="keys" aria-label="Calculator keys">
      <button class="utility" data-action="clear" aria-label="Clear">AC</button>
      <button class="utility" data-action="sign" aria-label="Toggle sign">+/−</button>
      <button class="utility" data-action="percent" aria-label="Percent">%</button>
      <button class="operator" data-operation="divide" aria-label="Divide">÷</button>

      <button data-digit="7">7</button>
      <button data-digit="8">8</button>
      <button data-digit="9">9</button>
      <button class="operator" data-operation="multiply" aria-label="Multiply">×</button>

      <button data-digit="4">4</button>
      <button data-digit="5">5</button>
      <button data-digit="6">6</button>
      <button class="operator" data-operation="subtract" aria-label="Subtract">−</button>

      <button data-digit="1">1</button>
      <button data-digit="2">2</button>
      <button data-digit="3">3</button>
      <button class="operator" data-operation="add" aria-label="Add">+</button>

      <button class="utility zero" data-digit="0">0</button>
      <button data-action="decimal" aria-label="Decimal point">.</button>
      <button class="equals" data-action="equals" aria-label="Equals">=</button>
    </div>
    <p class="hint" id="hint">Calculations run on the Python server</p>
  </main>

  <script>
    const resultDisplay = document.querySelector("#result");
    const expressionDisplay = document.querySelector("#expression");
    const hint = document.querySelector("#hint");

    let displayValue = "0";
    let storedValue = null;
    let pendingOperation = null;
    let waitingForInput = false;
    let justCalculated = false;

    const symbols = { add: "+", subtract: "−", multiply: "×", divide: "÷" };

    function render() {
      resultDisplay.textContent = displayValue;
    }

    function clearError() {
      hint.textContent = "Calculations run on the Python server";
      hint.classList.remove("error");
    }

    function enterDigit(digit) {
      clearError();
      if (waitingForInput || justCalculated) {
        displayValue = digit;
        waitingForInput = false;
        justCalculated = false;
      } else if (displayValue.replace("-", "").length < 16) {
        displayValue = displayValue === "0" ? digit : displayValue + digit;
      }
      render();
    }

    function enterDecimal() {
      clearError();
      if (waitingForInput || justCalculated) {
        displayValue = "0.";
        waitingForInput = false;
        justCalculated = false;
      } else if (!displayValue.includes(".")) {
        displayValue += ".";
      }
      render();
    }

    async function chooseOperation(operation) {
      clearError();
      if (pendingOperation && !waitingForInput) {
        const succeeded = await runCalculation();
        if (!succeeded) return;
      }
      storedValue = displayValue;
      pendingOperation = operation;
      waitingForInput = true;
      justCalculated = false;
      expressionDisplay.textContent = `${displayValue} ${symbols[operation]}`;
      document.querySelectorAll("[data-operation]").forEach((button) => {
        button.classList.toggle("selected", button.dataset.operation === operation);
      });
    }

    async function runCalculation() {
      if (!pendingOperation || storedValue === null || waitingForInput) return;

      const left = storedValue;
      const right = displayValue;
      const operation = pendingOperation;
      expressionDisplay.textContent = `${left} ${symbols[operation]} ${right} =`;
      hint.textContent = "Calculating…";
      hint.classList.remove("error");

      try {
        const response = await fetch("/calculate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ left, right, operation })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Calculation failed.");

        displayValue = data.result;
        storedValue = null;
        pendingOperation = null;
        waitingForInput = false;
        justCalculated = true;
        hint.textContent = "Calculations run on the Python server";
        document.querySelectorAll("[data-operation]").forEach((button) => button.classList.remove("selected"));
        render();
        return true;
      } catch (error) {
        hint.textContent = error.message || "Could not reach the calculator server.";
        hint.classList.add("error");
        return false;
      }
    }

    function performAction(action) {
      clearError();
      if (action === "clear") {
        displayValue = "0";
        storedValue = null;
        pendingOperation = null;
        waitingForInput = false;
        justCalculated = false;
        expressionDisplay.textContent = "";
        document.querySelectorAll("[data-operation]").forEach((button) => button.classList.remove("selected"));
        render();
      } else if (action === "sign" && displayValue !== "0") {
        displayValue = displayValue.startsWith("-") ? displayValue.slice(1) : `-${displayValue}`;
        render();
      } else if (action === "percent") {
        displayValue = String(Number(displayValue) / 100);
        render();
      } else if (action === "decimal") {
        enterDecimal();
      } else if (action === "equals") {
        runCalculation();
      }
    }

    document.querySelector(".keys").addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      if (button.dataset.digit !== undefined) enterDigit(button.dataset.digit);
      else if (button.dataset.operation) chooseOperation(button.dataset.operation);
      else if (button.dataset.action) performAction(button.dataset.action);
    });

    document.addEventListener("keydown", (event) => {
      if (/^\d$/.test(event.key)) enterDigit(event.key);
      else if (event.key === ".") enterDecimal();
      else if (event.key === "Escape") performAction("clear");
      else if (event.key === "Backspace") {
        clearError();
        if (!waitingForInput && !justCalculated) {
          displayValue = displayValue.length <= 1 || (displayValue.length === 2 && displayValue.startsWith("-"))
            ? "0"
            : displayValue.slice(0, -1);
          render();
        }
      } else if (event.key === "Enter" || event.key === "=") {
        event.preventDefault();
        runCalculation();
      } else if (event.key === "+") chooseOperation("add");
      else if (event.key === "-") chooseOperation("subtract");
      else if (event.key === "*") chooseOperation("multiply");
      else if (event.key === "/") {
        event.preventDefault();
        chooseOperation("divide");
      }
    });
  </script>
</body>
</html>
